<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闪灯反应计时 · Reaction Trainer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body { margin: 0; background: #0b0b0c; color: var(--paper); }
  .wrap { display: flex; gap: 28px; padding: 24px; align-items: flex-start; }
  .stage { display: block; width: 540px; height: 960px; background: #0b0b0c; cursor: pointer; border: 0; }
  .panel { font-family: var(--font-mono); font-size: var(--t-small); max-width: 300px; }

  .panel h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
              color: rgba(242,240,235,.34); margin: 0 0 14px; font-weight: 400; }
  .panel p { margin: 0 0 12px; line-height: 1.55; color: rgba(242,240,235,.55); }
  .panel kbd { font: inherit; padding: 1px 6px; border: 1px solid rgba(242,240,235,.24); }

  .stat { display: flex; justify-content: space-between; gap: 12px;
          padding: 7px 0; border-bottom: 1px solid rgba(242,240,235,.10); }
  .stat span:first-child { color: rgba(242,240,235,.34); }
  .stat span:last-child { font-variant-numeric: tabular-nums; }

  .panel button {
    margin-top: 18px; width: 100%; padding: 13px; cursor: pointer;
    background: var(--accent); color: #0b0b0c;
    border: 0; border-radius: 0;            /* 硬边，不许圆角 */
    font: inherit; letter-spacing: .10em;
  }
  .panel button.ghost { background: transparent; color: var(--accent);
                        border: 1px solid var(--accent); }
  .panel button:hover { filter: brightness(1.12); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel" id="panel">
    <h1>闪灯反应计时</h1>
    <p>点画布开始。等灯，别抢跑。闪灯那一刻计时，点到就停。</p>
    <p>跑满 5 次出平均。<kbd>空格</kbd> 和点击等价。</p>

    <div class="stat"><span>样本</span><span id="o-n">5 / 5</span></div>
    <div class="stat"><span>抢跑</span><span id="o-foul">0</span></div>
    <div class="stat"><span>状态</span><span id="o-mode">idle</span></div>

    <button id="export">导出 9:16</button>
    <button id="reset" class="ghost">清空重来</button>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
