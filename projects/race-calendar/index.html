<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>赛历 · race-calendar</title>
<link rel="stylesheet" href="./design-tokens.css">
<link rel="stylesheet" href="./panel.css">
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <aside class="panel" id="panel">
    <div class="hd">
      <span class="k">RACE-CALENDAR</span>
      <span class="v">赛历</span>
    </div>

    <section class="sec">
      <div class="lb"><span>01 / 本地日期</span></div>
      <div class="readout" id="now">----</div>
      <p class="note">倒计时只按这台电脑的日期算，不查任何时间服务器。</p>
    </section>

    <section class="sec">
      <div class="lb"><span>02 / 只看</span></div>
      <div class="chips" id="filters"></div>
    </section>

    <section class="sec">
      <div class="lb"><span>03 / 导出</span></div>
      <div class="row">
        <button id="ex1" type="button">9:16 竖版</button>
        <button id="ex2" type="button">4:5 封面</button>
      </div>
      <div style="margin-top:12px">
        <div class="stat"><span>已完赛</span><b id="sDone">0</b></div>
        <div class="stat"><span>进行中</span><b id="sLive">0</b></div>
        <div class="stat"><span>待开赛</span><b id="sNext">0</b></div>
      </div>
    </section>
  </aside>
</div>

<script src="./dist/app.js"></script>
</body>
</html>
