<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>质量分配 · Mass Budget</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #070708;
    color: #f2f0eb;
    font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap {
    display: flex; gap: 32px; padding: 28px;
    align-items: flex-start; min-height: 100vh; box-sizing: border-box;
  }
  #stage {
    display: block;
    width: 432px; height: 768px;
    background: #0b0b0c;
    flex: 0 0 auto;
    border: 1px solid rgba(242,240,235,0.10);
  }
  .panel {
    flex: 1 1 auto; max-width: 380px; min-width: 280px;
    font-family: "JetBrains Mono","IBM Plex Mono","Roboto Mono",Consolas,"Microsoft YaHei","Noto Sans SC",monospace;
    font-size: 13px; line-height: 1.5;
  }
  .panel h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; margin: 0 0 4px;
    color: rgba(242,240,235,0.92);
  }
  .panel .hint {
    font-size: 11px; color: rgba(242,240,235,0.42);
    margin: 0 0 22px; line-height: 1.6;
  }
  .row { margin-bottom: 20px; }
  .row .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    color: rgba(242,240,235,0.55); margin-bottom: 7px;
  }
  .row .val { color: #e8590c; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .unit { color: rgba(242,240,235,0.4); font-size: 11px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px; background: rgba(242,240,235,0.18);
    outline: none; margin: 0; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 0;
    background: #e8590c; cursor: pointer;
  }
  fieldset {
    border: 0; border-top: 1px solid rgba(242,240,235,0.10);
    margin: 0 0 18px; padding: 16px 0 0;
  }
  legend {
    padding: 0 8px 0 0; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(242,240,235,0.40);
  }
  .kv {
    display: flex; justify-content: space-between;
    padding: 5px 0; color: rgba(242,240,235,0.55);
    border-bottom: 1px dotted rgba(242,240,235,0.10);
  }
  .kv b { color: #f2f0eb; font-weight: 500; font-variant-numeric: tabular-nums; }
  button {
    width: 100%; padding: 13px; margin-top: 6px; cursor: pointer;
    background: #e8590c; color: #0b0b0c;
    border: 0; border-radius: 0;
    font: inherit; font-weight: 600; letter-spacing: .10em;
    text-transform: uppercase;
  }
  button.ghost {
    background: transparent; color: rgba(242,240,235,0.7);
    border: 1px solid rgba(242,240,235,0.22);
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  .note {
    font-size: 11px; color: rgba(242,240,235,0.34);
    line-height: 1.7; margin-top: 18px;
    border-top: 1px solid rgba(242,240,235,0.08); padding-top: 14px;
  }
  .note b { color: rgba(242,240,235,0.55); font-weight: 500; }
  @media (max-width: 860px) {
    .wrap { flex-direction: column; gap: 20px; padding: 16px; }
    #stage { width: 320px; height: 569px; }
    .panel { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel">
    <h1>质量分配</h1>
    <p class="hint">配重的质量和位置是这台车唯一还能改的东西 · 拖动看重心怎么被拉走</p>

    <div class="row">
      <div class="lab"><span>配重质量</span><span class="val"><span id="massOut">14</span> <span class="unit">g</span></span></div>
      <input id="balMass" type="range" min="0" max="30" step="1" value="14">
    </div>

    <div class="row">
      <div class="lab"><span>配重横向位置</span><span class="val"><span id="yOut">+4.0</span> <span class="unit">mm</span></span></div>
      <input id="balY" type="range" min="-8" max="8" step="0.1" value="4">
    </div>

    <div class="row">
      <div class="lab"><span>配重高度</span><span class="val"><span id="zOut">8</span> <span class="unit">mm</span></span></div>
      <input id="balZ" type="range" min="2" max="16" step="1" value="8">
    </div>

    <fieldset>
      <legend>当前读数</legend>
      <div class="kv"><span>临界横向偏移</span><b>1.32 mm</b></div>
      <div class="kv"><span>轮距</span><b>42 mm</b></div>
      <div class="kv"><span>推力峰值</span><b>21 N</b></div>
    </fieldset>

    <button id="reset" class="ghost">恢复到初始配重</button>
    <button id="export">导出 9:16</button>

    <p class="note">
      <b>参数来源</b><br>
      推力峰值 21 N、轮距 42 mm = <b>待实测</b><br>
      临界横向偏移 1.32 mm = <b>车队实测值</b><br>
      各部件质量与位置 = <b>粗称 + 估读</b>，不是精确值
    </p>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
