<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>head-to-head · 两车同跑 20 m</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body { margin: 0; background: #0b0b0c; color: var(--paper); }
  .wrap { display: flex; gap: 28px; padding: 24px; align-items: flex-start; }
  .stage { display: block; width: 540px; height: 960px; background: #0b0b0c; flex: none; }
  .panel {
    font-family: "JetBrains Mono","IBM Plex Mono","Roboto Mono",Consolas,"Microsoft YaHei","Noto Sans SC",monospace;
    font-size: 13px; width: 300px; flex: none;
  }
  .panel h2 {
    font-family: "Bahnschrift","Barlow Condensed","Microsoft YaHei",sans-serif;
    font-size: 15px; font-weight: 600; letter-spacing: .04em;
    margin: 26px 0 10px; color: #f2f0eb;
  }
  .panel h2:first-child { margin-top: 0; }
  .panel h2 .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .row label { opacity: .6; flex: 1; }
  .row output { color: #e8590c; font-variant-numeric: tabular-nums; min-width: 74px; text-align: right; }
  .panel input[type=range] { width: 100%; margin: 2px 0 12px; accent-color: #e8590c; }
  .panel button {
    margin-top: 10px; width: 100%; padding: 13px; cursor: pointer;
    background: #e8590c; color: #0b0b0c; border: 0; border-radius: 0;
    font: inherit; letter-spacing: .08em;
  }
  .panel button.ghost { background: transparent; color: #f2f0eb; border: 1px solid rgba(242,240,235,.24); }
  .panel button:hover { filter: brightness(1.12); }
  .hint { opacity: .42; line-height: 1.6; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div class="panel" id="panel">
    <h2><span class="dot" style="background:#e8590c"></span>车 A</h2>
    <div class="row"><label for="a-m">车体质量</label><output id="o-a-m">65.0 g</output></div>
    <input id="a-m" type="range" min="55" max="85" step="0.5" value="65">
    <div class="row"><label for="a-cd">阻力系数 Cd0</label><output id="o-a-cd">0.340</output></div>
    <input id="a-cd" type="range" min="0.25" max="0.50" step="0.005" value="0.34">
    <div class="row"><label for="a-f">峰值推力</label><output id="o-a-f">21.0 N</output></div>
    <input id="a-f" type="range" min="14" max="28" step="0.1" value="21">
    <div class="row"><label for="a-t">燃烧时长</label><output id="o-a-t">110 ms</output></div>
    <input id="a-t" type="range" min="75" max="150" step="1" value="110">

    <h2><span class="dot" style="background:#b9b4ab"></span>车 B</h2>
    <div class="row"><label for="b-m">车体质量</label><output id="o-b-m">68.0 g</output></div>
    <input id="b-m" type="range" min="55" max="85" step="0.5" value="68">
    <div class="row"><label for="b-cd">阻力系数 Cd0</label><output id="o-b-cd">0.350</output></div>
    <input id="b-cd" type="range" min="0.25" max="0.50" step="0.005" value="0.35">
    <div class="row"><label for="b-f">峰值推力</label><output id="o-b-f">20.8 N</output></div>
    <input id="b-f" type="range" min="14" max="28" step="0.1" value="20.8">
    <div class="row"><label for="b-t">燃烧时长</label><output id="o-b-t">109 ms</output></div>
    <input id="b-t" type="range" min="75" max="150" step="1" value="109">

    <button id="export">导出 9:16</button>
    <button id="restart" class="ghost">重跑一次</button>
    <div class="hint">两车同参数时成绩必须完全相等，这是自检里的一条断言。</div>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
