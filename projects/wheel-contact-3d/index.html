<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>轮轨接触受力 · Wheel Contact</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; background: #070708; color: #f2f0eb;
    font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap {
    display: flex; gap: 32px; padding: 28px;
    align-items: flex-start; min-height: 100vh; box-sizing: border-box;
  }
  #stage {
    display: block; width: 432px; height: 768px;
    background: #0b0b0c; flex: 0 0 auto;
    border: 1px solid rgba(242,240,235,0.10);
  }
  .panel {
    flex: 1 1 auto; max-width: 360px; min-width: 260px;
    font-family: "JetBrains Mono","IBM Plex Mono","Roboto Mono",Consolas,"Microsoft YaHei","Noto Sans SC",monospace;
    font-size: 13px; line-height: 1.5;
  }
  .panel h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; margin: 0 0 4px;
  }
  .panel .hint { font-size: 11px; color: rgba(242,240,235,0.42); margin: 0 0 22px; line-height: 1.7; }
  .row { margin-bottom: 20px; }
  .row .lab {
    display: block; color: rgba(242,240,235,0.55); margin-bottom: 7px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  .row .val { float: right; color: #e8590c; letter-spacing: 0; }
  input[type=range] {
    width: 100%; height: 26px; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: rgba(242,240,235,0.22);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -6px;
    background: #e8590c; border: 0; border-radius: 0;
  }
  .chk { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; }
  .chk input { width: 15px; height: 15px; accent-color: #e8590c; cursor: pointer; }
  button {
    width: 100%; padding: 14px; margin-top: 6px; cursor: pointer;
    background: #e8590c; color: #0b0b0c; border: 0; border-radius: 0;
    font: inherit; font-weight: 600; letter-spacing: .10em; text-transform: uppercase;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  .note {
    font-size: 11px; color: rgba(242,240,235,0.34); line-height: 1.8;
    margin-top: 20px; border-top: 1px solid rgba(242,240,235,0.08); padding-top: 14px;
  }
  .note b { color: rgba(242,240,235,0.55); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 820px) {
    .wrap { flex-direction: column; gap: 20px; padding: 16px; }
    #stage { width: 300px; height: 533px; }
    .panel { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel">
    <h1>轮轨接触受力</h1>
    <p class="hint">左前轮接地点 · 法向力 / 切向摩擦 / 侧向力</p>

    <div class="row">
      <span class="lab">质心横向偏移 <span class="val" id="offsetVal">0.40 mm</span></span>
      <input id="offset" type="range" min="0" max="8" step="0.02" value="0.40">
    </div>

    <div class="row">
      <label class="chk"><input id="thrust" type="checkbox" checked> 推力接通（21 N）</label>
    </div>

    <button id="export">导出 9:16</button>

    <p class="note">
      <b>临界偏移不是 1.32 mm</b><br>
      网上流传的「1.32 mm / 5.96 mN·m」那对数字，是旧 4.5 N 平台推力模型下的结果。
      本模型用 21 N 峰值推力，算出来是 <b>0.307 mm</b>。<br>
      两个数不能混用：<b>5.96 ÷ 1.32 = 4.52 N</b>，正好是那个被废弃的推力值。<br><br>
      参数标注见 README，<b>[VERIFY]</b> 的都还没实测。
    </p>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
