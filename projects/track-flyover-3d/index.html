<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20 m 直线赛道三维漫游 · track-flyover-3d</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body { margin: 0; background: #0b0b0c; color: var(--paper); }
  .wrap {
    display: flex; gap: var(--sp-4); padding: var(--sp-4);
    align-items: flex-start; justify-content: center; flex-wrap: wrap;
  }
  #stage {
    display: block; width: auto; height: auto;
    max-height: 82vh; max-width: 96vw;
    border: 1px solid var(--line); background: var(--ink);
  }
  .panel {
    font-family: var(--font-mono); font-size: var(--t-small);
    min-width: 272px; max-width: 300px;
    border: 1px solid var(--line); background: var(--ink-2);
    padding: var(--sp-3);
  }
  .panel h2 {
    font-family: var(--font-mono); font-size: var(--t-micro);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--mute); font-weight: 500; margin: 0 0 var(--sp-3);
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
  .row output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .field { margin-bottom: var(--sp-3); }
  .field label { display: block; margin-bottom: 6px; opacity: .62; letter-spacing: 0.06em; }
  input[type=range] { width: 100%; display: block; }
  .btns { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-3); }
  .btns button { width: 100%; padding: 12px; }
  .note {
    font-family: var(--font-mono); font-size: var(--t-micro);
    color: var(--mute-2); line-height: 1.7; margin: var(--sp-3) 0 0;
    letter-spacing: 0.02em;
  }
  .note b { color: var(--mute); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel">
    <h2>Track flyover</h2>

    <div class="field">
      <div class="row"><label for="prog">相机进度</label><output id="prog-out">0%</output></div>
      <input id="prog" type="range" min="0" max="1000" step="1" value="0">
    </div>

    <div class="field">
      <div class="row"><label for="slow">慢放系数</label><output id="slow-out">0.25×</output></div>
      <input id="slow" type="range" min="5" max="100" step="5" value="25">
    </div>

    <div class="btns">
      <button id="pause">暂停</button>
      <button id="export" data-primary>导出 9:16 + 4:5</button>
    </div>

    <p class="note">
      速度剖面不是拟合出来的，是<b>积分</b>出来的：<br>
      推力 F(t) = 21·sin(πt/0.110) N（110 ms 后归零），阻力 ½ρCdAv²，滚阻 Crr·m·g。<br>
      RK4 步长 1e-5，冲线那一步线性插值 → <b>1.1885 s / 16.906 m/s</b>，峰值 18.347 m/s。<br>
      <b>21 N 和 110 ms 都标 [VERIFY]</b>，队里没实测过。队里唯一实测的是
      1.230 s / 19.93 m/s，和这里差 3.5%——原因写在 PHYSICS.md 第七节。<br>
      跑道宽 0.180 m 也标 <b>[VERIFY]</b>，还没量。
    </p>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
