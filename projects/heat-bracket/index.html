<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>淘汰赛对阵图 · Heat Bracket</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; background: #070708; color: #f2f0eb;
    font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap {
    display: flex; gap: 32px; padding: 28px;
    align-items: flex-start; min-height: 100vh; box-sizing: border-box;
  }
  #stage {
    display: block; width: 432px; height: 768px;
    background: #0b0b0c; flex: 0 0 auto;
    border: 1px solid rgba(242,240,235,0.10);
  }
  .panel {
    flex: 1 1 auto; max-width: 340px; min-width: 260px;
    font-family: "JetBrains Mono","IBM Plex Mono","Roboto Mono",Consolas,"Microsoft YaHei","Noto Sans SC",monospace;
    font-size: 13px; line-height: 1.5;
  }
  .panel h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; margin: 0 0 4px;
  }
  .panel .hint {
    font-size: 11px; color: rgba(242,240,235,0.42);
    margin: 0 0 22px; line-height: 1.7;
  }
  .row { margin-bottom: 20px; }
  .row .lab {
    display: block; color: rgba(242,240,235,0.55); margin-bottom: 7px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  select {
    width: 100%; padding: 11px 12px; cursor: pointer;
    background: #0b0b0c; color: #f2f0eb;
    border: 1px solid rgba(242,240,235,0.18); border-radius: 0;
    font: inherit; font-size: 13px;
    -webkit-appearance: none; appearance: none;
  }
  select:focus { outline: 0; border-color: #e8590c; }
  button {
    width: 100%; padding: 14px; margin-top: 6px; cursor: pointer;
    background: #e8590c; color: #0b0b0c; border: 0; border-radius: 0;
    font: inherit; font-weight: 600; letter-spacing: .10em; text-transform: uppercase;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  .note {
    font-size: 11px; color: rgba(242,240,235,0.34);
    line-height: 1.8; margin-top: 20px;
    border-top: 1px solid rgba(242,240,235,0.08); padding-top: 14px;
  }
  .note b { color: rgba(242,240,235,0.55); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 820px) {
    .wrap { flex-direction: column; gap: 20px; padding: 16px; }
    #stage { width: 300px; height: 533px; }
    .panel { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel">
    <h1>淘汰赛对阵图</h1>
    <p class="hint">20.00 m 直线 · 单败淘汰 · 每场只有一次机会</p>

    <div class="row">
      <span class="lab">参赛车数</span>
      <select id="size">
        <option value="4">4 台</option>
        <option value="8">8 台</option>
        <option value="16" selected>16 台</option>
      </select>
    </div>

    <div class="row">
      <span class="lab">成绩显示</span>
      <select id="mode">
        <option value="time" selected>绝对成绩</option>
        <option value="delta">与胜者差值</option>
      </select>
    </div>

    <button id="export">导出 9:16</button>

    <p class="note">
      <b>关于这批成绩</b><br>
      车号、姓名、成绩都是<b>固定种子生成的示例数据</b>，
      不是真实赛事记录。成绩区间 1.150–1.370 s，
      对应 20 米直线。<br><br>
      换成你们队的真实数据：改 <b>src/main.js</b> 里的
      <b>NAMES</b> 和 <b>makeField()</b>，再跑一次 build。
    </p>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
