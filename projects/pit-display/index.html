<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>维修区计时牌 · Pit Board</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body { margin: 0; background: #0B0B0C; color: #F2F0EB; }
  body {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 16px; min-height: 100vh;
  }
  #stage {
    display: block;
    max-height: 74vh; max-width: 96vw; width: auto; height: auto;
    border: 1px solid rgba(255,255,255,.14);
    background: #0B0B0C;
  }
  .bar {
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end;
    justify-content: center; max-width: 96vw;
    border: 1px solid rgba(255,255,255,.14);
    background: #151517; padding: 16px 24px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .label {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: rgba(242,240,235,.55);
  }
  .field input {
    font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums;
    background: #0B0B0C; color: #F2F0EB;
    border: 1px solid rgba(255,255,255,.14); border-radius: 0;
    padding: 8px 10px; width: 132px;
  }
  .field input:focus { outline: 0; border-color: #E8590C; }
  .field input[type=number] { width: 112px; }
  button {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em;
    text-transform: uppercase; color: #F2F0EB; background: transparent;
    border: 1px solid rgba(255,255,255,.14); border-radius: 0;
    padding: 9px 24px; cursor: pointer;
  }
  button:hover { border-color: #E8590C; color: #E8590C; }
  button[data-primary] { border-color: #E8590C; color: #E8590C; }
  button[data-primary]:hover { background: #E8590C; color: #0B0B0C; }
  .hint {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
    color: rgba(242,240,235,.32); text-align: center; margin: 0;
  }
</style>
</head>
<body>

<canvas id="stage" width="1080" height="1350"></canvas>

<div class="bar">
  <div class="field"><span class="label">车号</span><input id="car" value="07" maxlength="3"></div>
  <div class="field"><span class="label">队名</span><input id="team" value="长风 CZ-3"></div>
  <div class="field"><span class="label">成绩 / s</span><input id="time" type="number" step="0.001" value="1.142"></div>
  <div class="field"><span class="label">名次</span><input id="rank" type="number" step="1" min="1" value="1"></div>
  <div class="field"><span class="label">参赛数</span><input id="field" type="number" step="1" min="2" value="18"></div>
  <div class="field"><span class="label">头名成绩 / s</span><input id="lead" type="number" step="0.001" value="1.142"></div>
  <button id="reset">恢复默认</button>
  <button id="export" data-primary>导出 9:16 + 4:5</button>
</div>

<p class="hint">导出 1080×1920 竖版 + 1080×1350 封面 · 双击本文件即可运行 · 不读取任何外部资源</p>

<script src="./dist/app.js"></script>
</body>
</html>
