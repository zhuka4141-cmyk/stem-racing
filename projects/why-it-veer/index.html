"use strict";
const DATA = {"id": "why-it-veer", "series": "偏移诊断", "episode": "01", "w": 1080, "h": 1920, "fps": 30, "duration": 26.0, "palette": {"bg": "#0C0D0F", "panel": "#141619", "hair": "#2A2E33", "text": "#E8E6E1", "dim": "#8A8F96", "accent": "#E8590C", "warn": "#F2C744", "body": "#D9D5CC", "pod": "#CFCAC0", "canopy": "#2E3238", "dark": "#252A31", "wheel": "#16181C", "hub": "#6D737B", "pin": "#E8590C", "com": "#F2C744", "floor": "#1E2126", "rail": "#3D434B", "wall": "#33383F", "stripe_a": "#23272C", "stripe_b": "#282D33", "stripe_ticks": "#4A5058"}, "beats": [{"t0": 0.0, "t1": 2.2, "kicker": "STEM RACING · 偏移诊断 01", "head": [["mono_b", "4.0 mm"], ["cjk_b", " 的偏心"]], "sub": "车头在 {contact:.3f} m 就贴上导轨壁", "panel": "bar", "nums": null}, {"t0": 2.2, "t1": 5.2, "kicker": "问题", "head": [["cjk_b", "为什么车头"], ["cjk_b", "会越跑越贴墙"]], "sub": "不是轮子歪：质心没落在导向销上", "panel": "none", "nums": null}, {"t0": 5.2, "t1": 9.0, "kicker": "俯视 · 质心位置", "head": [["cjk_b", "质心偏右 "], ["mono_b", "{d_now:.1f} mm"]], "sub": "导向销卡在中心线上，质心不在", "panel": "none", "nums": null}, {"t0": 9.0, "t1": 11.5, "kicker": "出发瞬间", "head": [["mono_b", "M = m · a · d"], ["cjk_b", ""]], "sub": "a 峰值 {a_peak:.0f} m/s²，M 峰值 {M:.1f} mN·m", "panel": "none", "nums": null}, {"t0": 11.5, "t1": 14.0, "kicker": "前轮能顶住多少", "head": [["mono_b", "{Mtyre:.2f}"], ["cjk_b", " mN·m"]], "sub": "力矩是它的 {over:.1f} 倍", "panel": "none", "nums": null}, {"t0": 14.0, "t1": 16.5, "kicker": "贴合位置", "head": [["mono_b", "{contact:.3f} m"]], "sub": "车头偏出 {nose:.1f} mm，正好碰到壁", "panel": "bar", "nums": null}, {"t0": 16.5, "t1": 19.0, "kicker": "之后", "head": [["cjk_b", "剩下 "], ["mono_b", "{rest:.2f} m"], ["cjk_b", " 一直蹭"]], "sub": "蹭掉 {work:.3f} J，多花 {dt:.1f} ms", "panel": "bar", "nums": null}, {"t0": 19.0, "t1": 24.0, "kicker": "20 m 容差", "head": [["cjk_b", "容差只有 "], ["mono_b", "{dcrit:.2f} mm"]], "sub": "我们做到了 4.0 mm，超了 {over:.1f} 倍", "panel": "nums", "nums": [["20 m 用时", "t20", "s"], ["末速", "v", "m/s"], ["超限", "over", "×"]]}, {"t0": 24.0, "t1": 26.0, "kicker": "STEM RACING · 偏移诊断 01", "head": [["mono_b", "4.0 mm"], ["cjk_b", " 的偏心"]], "sub": "车头在 {contact:.3f} m 就贴上导轨壁", "panel": "bar", "nums": null}], "num": {"t20": 1.1729, "v": 16.7986, "a_peak": 347.19, "M": 83.325, "Mtyre": 5.96, "dcrit": 0.286, "over": 13.98, "contact": 0.0447, "nose": 3.0, "work": 0.0648, "dt_ms": 8.0, "rest": 19.9553, "d_now": 4.0, "psi": 1.91, "track": 20.0, "ref_t": 1.1649, "ref_v": 16.9642}, "timeline": [[0.0, 2.2], [2.2, 5.2], [5.2, 9.0], [9.0, 11.5], [11.5, 14.0], [14.0, 16.5], [16.5, 19.0], [19.0, 24.0], [24.0, 26.0]], "trace": [[0.0001, 0.0, 0.0002], [0.0184, 0.05304, 1.9102], [0.0367, 0.18962, 1.9102], [0.0547, 0.38213, 1.9102], [0.0727, 0.616, 1.9102], [0.0907, 0.87953, 1.9102], [0.1087, 1.16426, 1.9102], [0.1267, 1.46411, 1.9102], [0.1447, 1.77467, 1.9102], [0.1631, 2.0999, 1.9102], [0.1815, 2.43056, 1.9102], [0.2045, 2.84889, 1.9102], [0.2229, 3.18609, 1.9102], [0.2413, 3.52463, 1.9102], [0.2597, 3.86391, 1.9102], [0.2781, 4.20351, 1.9102], [0.2965, 4.54314, 1.9102], [0.3149, 4.88258, 1.9102], [0.3333, 5.22167, 1.9102], [0.3517, 5.5603, 1.9102], [0.3701, 5.89841, 1.9102], [0.3885, 6.23593, 1.9102], [0.4069, 6.57283, 1.9102], [0.4253, 6.90909, 1.9102], [0.4437, 7.24468, 1.9102], [0.4621, 7.57958, 1.9102], [0.4805, 7.91381, 1.9102], [0.4989, 8.24734, 1.9102], [0.5173, 8.58018, 1.9102], [0.5357, 8.91232, 1.9102], [0.5541, 9.24377, 1.9102], [0.5725, 9.57453, 1.9102], [0.5955, 9.987, 1.9102], [0.6139, 10.3162, 1.9102], [0.6323, 10.64471, 1.9102], [0.6507, 10.97254, 1.9102], [0.6691, 11.29969, 1.9102], [0.6875, 11.62615, 1.9102], [0.7059, 11.95193, 1.9102], [0.7243, 12.27704, 1.9102], [0.7427, 12.60147, 1.9102], [0.7611, 12.92524, 1.9102], [0.7795, 13.24833, 1.9102], [0.7979, 13.57076, 1.9102], [0.8163, 13.89253, 1.9102], [0.8347, 14.21363, 1.9102], [0.8531, 14.53408, 1.9102], [0.8715, 14.85387, 1.9102], [0.8899, 15.17301, 1.9102], [0.9083, 15.49149, 1.9102], [0.9267, 15.80933, 1.9102], [0.9451, 16.12653, 1.9102], [0.9635, 16.44308, 1.9102], [0.9865, 16.83787, 1.9102], [1.0049, 17.15298, 1.9102], [1.0233, 17.46745, 1.9102], [1.0417, 17.7813, 1.9102], [1.0601, 18.09451, 1.9102], [1.0785, 18.4071, 1.9102], [1.0969, 18.71906, 1.9102], [1.1153, 19.03039, 1.9102], [1.1337, 19.34111, 1.9102], [1.1521, 19.6512, 1.9102], [1.1705, 19.96068, 1.9102]]};
const W = DATA.w, H = DATA.h, FPS = DATA.fps;
const N = Math.round(DATA.duration * FPS);
const P = DATA.palette;
const SAFE = { x0: 60, x1: 930, y0: 240, y1: 1480 };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { willReadFrequently: true });
let frame = 0, playing = true, errs = [];

function hex(h) { return h; }
function cjk(size, weight) {
  return (weight || 400) + ' ' + size + 'px "Microsoft YaHei","Microsoft YaHei UI",sans-serif';
}
function mono(size, bold) {
  return (bold ? '700 ' : '400 ') + size + 'px Consolas,"Courier New",monospace';
}
function f2(v) { return Math.abs(v) < 10 ? v.toFixed(2) : v.toFixed(1); }

function beatAt(t) {
  for (let i = 0; i < DATA.beats.length; i++) {
    const b = DATA.beats[i];
    if (t >= b.t0 && t < b.t1) return b;
  }
  return DATA.beats[DATA.beats.length - 1];
}
function beatIndex(t) {
  for (let i = 0; i < DATA.beats.length; i++) {
    const b = DATA.beats[i];
    if (t >= b.t0 && t < b.t1) return i;
  }
  return DATA.beats.length - 1;
}

/* piecewise video-time -> sim-time, matching src/blender/build.py */
const KEYS = [[0.0, 0.0], [2.2, 0.090], [5.2, 0.090], [9.0, 0.130], [11.5, 0.180],
              [14.0, 0.230], [16.5, 0.280], [19.0, 0.900], [24.0, DATA.num.t20]];
function simTime(vt) {
  if (vt >= 24.0) vt -= 24.0;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const a = KEYS[i], b = KEYS[i + 1];
    if (vt >= a[0] && vt <= b[0]) {
      const f = b[0] === a[0] ? 0 : (vt - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * f;
    }
  }
  return KEYS[KEYS.length - 2][1];
}
function sampleSim(st) {
  const tr = DATA.trace;
  if (st <= tr[0][0]) return { t: tr[0][0], s: tr[0][1], psi: tr[0][2] };
  if (st >= tr[tr.length - 1][0]) {
    const e = tr[tr.length - 1];
    return { t: e[0], s: e[1], psi: e[2] };
  }
  for (let i = 0; i < tr.length - 1; i++) {
    if (st >= tr[i][0] && st <= tr[i + 1][0]) {
      const a = tr[i], b = tr[i + 1];
      const f = b[0] === a[0] ? 0 : (st - a[0]) / (b[0] - a[0]);
      return { t: st, s: a[1] + (b[1] - a[1]) * f, psi: a[2] + (b[2] - a[2]) * f };
    }
  }
  const e = tr[tr.length - 1];
  return { t: e[0], s: e[1], psi: e[2] };
}

function fmtSub(s, n) {
  return s.replace(/\{(\w+):\.(\d)f\}/g, (m, k, d) => (n[k] !== undefined ? n[k].toFixed(+d) : m));
}
function runsWidth(runs) {
  let w = 0;
  for (const [fk, txt] of runs) {
    for (const ch of txt) {
      if (/[\u4e00-\u9fff]/.test(ch)) w += 1.0;
      else if (ch === ' ') w += 0.3;
      else w += 0.56;
    }
  }
  return w;
}
function drawRuns(runs, x, y, size, color) {
  let cx = x;
  ctx.textBaseline = 'alphabetic';
  for (const [fk, txt] of runs) {
    if (!txt) continue;
    const latin = (fk === 'mono' || fk === 'mono_b' || fk === 'cond');
    ctx.font = latin ? mono(size, fk === 'mono_b') : cjk(size, fk === 'cjk_b' ? 700 : 400);
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.fillText(txt, cx, y + size * 0.82);
    for (const ch of txt) {
      if (/[\u4e00-\u9fff]/.test(ch)) cx += size * 1.0;
      else if (ch === ' ') cx += size * 0.3;
      else cx += size * 0.56;
    }
  }
  return cx - x;
}

/* plan-view detail: rail, guide posts, body flank, lane wall */
function drawPlan(psi, s) {
  const PXMM = 4.0, cx = 540, noseY = 660;
  const clipY0 = 600, clipY1 = 1180;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, clipY0, W, clipY1 - clipY0); ctx.clip();
  ctx.fillStyle = '#16181C';
  ctx.fillRect(0, clipY0, W, clipY1 - clipY0);

  const bodyW = 69 * PXMM, bodyL = 228 * PXMM;
  const cyBody = noseY + 114 * PXMM;
  const wallX = cx + 37.5 * PXMM;

  /* lane wall */
  ctx.fillStyle = P.wall;
  ctx.fillRect(wallX, clipY0, 6 * PXMM, clipY1 - clipY0);
  ctx.fillStyle = P.hair;
  ctx.fillRect(wallX, clipY0, 2, clipY1 - clipY0);

  /* centre rail */
  ctx.fillStyle = P.rail;
  ctx.fillRect(cx - 1.5 * PXMM, clipY0, 3 * PXMM, clipY1 - clipY0);

  /* track graduations every 100 mm of car travel */
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  const off = (s * 1000 % 100) * PXMM;
  for (let y = clipY0 - off; y < clipY1; y += 100 * PXMM) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  /* car, yawed about the guide pin */
  ctx.save();
  ctx.translate(cx, cyBody);
  ctx.rotate(-psi * Math.PI / 180);
  ctx.fillStyle = P.body;
  ctx.fillRect(-bodyW / 2, -bodyL / 2, bodyW, bodyL);
  ctx.fillStyle = P.pod;
  ctx.fillRect(-bodyW / 2 - 10, -bodyL / 2 + 120, 14, bodyL - 240);
  ctx.fillRect(bodyW / 2 - 4, -bodyL / 2 + 120, 14, bodyL - 240);
  ctx.fillStyle = P.canopy;
  ctx.fillRect(-bodyW * 0.22, -bodyL / 2 + 150, bodyW * 0.44, 180);
  /* guide fork posts straddling the rail */
  ctx.fillStyle = P.pin;
  for (const dx of [-3 * PXMM, 3 * PXMM]) {
    ctx.beginPath();
    ctx.arc(dx, -bodyL / 2 + 40, 1.2 * PXMM, 0, Math.PI * 2);
    ctx.fill();
  }
  /* wheels */
  ctx.fillStyle = P.wheel;
  for (const sx of [-1, 1]) {
    for (const sy of [-1, 1]) {
      ctx.fillRect(sx * (bodyW / 2 - 6) - 8, sy * 75 * PXMM - 26, 16, 52);
    }
  }
  ctx.restore();

  /* centre of mass, offset to +X by d */
  const comX = cx + DATA.num.d_now * PXMM;
  const comY = cyBody - 35 * PXMM + 40;
  ctx.strokeStyle = P.warn; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(comX, comY, 12 * PXMM, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = P.warn;
  ctx.beginPath(); ctx.arc(comX, comY, 4, 0, Math.PI * 2); ctx.fill();

  /* dimension: offset from centreline */
  ctx.strokeStyle = P.warn; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, comY - 60); ctx.lineTo(comX, comY - 60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, comY - 72); ctx.lineTo(cx, comY - 48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(comX, comY - 72); ctx.lineTo(comX, comY - 48); ctx.stroke();
  ctx.font = mono(48, true); ctx.fillStyle = P.warn; ctx.textAlign = 'center';
  ctx.fillText(DATA.num.d_now.toFixed(1) + ' mm', (cx + comX) / 2, comY - 82);

  /* dimension: nose gap to the wall */
  const noseX = cx + (DATA.num.d_now - DATA.num.nose) * PXMM;
  ctx.strokeStyle = P.accent; ctx.lineWidth = 3;
  const gapY = clipY1 - 70;
  ctx.beginPath(); ctx.moveTo(noseX, gapY); ctx.lineTo(wallX, gapY); ctx.stroke();
  ctx.font = mono(44, true); ctx.fillStyle = P.accent; ctx.textAlign = 'right';
  ctx.fillText(DATA.num.nose.toFixed(1) + ' mm', wallX - 8, gapY - 14);

  ctx.restore();
}

function draw() {
  const t = frame / FPS;
  const b = beatAt(t);
  const bi = beatIndex(t);
  const st = sampleSim(simTime(t));
  const n = DATA.num;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);

  drawPlan(st.psi, st.s);

  /* bands */
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, 600);
  ctx.fillRect(0, 1180, W, H - 1180);
  ctx.fillStyle = P.hair;
  ctx.fillRect(0, 599, W, 2); ctx.fillRect(0, 1179, W, 2);

  /* kicker */
  ctx.font = cjk(48, 400); ctx.fillStyle = P.dim; ctx.textAlign = 'left';
  ctx.fillText(b.kicker, 60, 248 + 38);
  const span = b.t1 - b.t0;
  const dsim = Math.abs(simTime(Math.min(t + span, 23.9)) - simTime(t));
  if (dsim > 1e-6 && span / dsim > 1.5) {
    ctx.textAlign = 'right';
    ctx.fillText('慢放 ×' + Math.round(span / dsim), 930, 248 + 38);
  }
  ctx.fillStyle = P.hair; ctx.fillRect(60, 311, 870, 2);

  /* headline */
  const runs = b.head.filter(r => r[1]);
  const size = 108, lh = 120;
  const top = 330 + Math.max(0, Math.floor((258 - runs.length * lh) / 2));
  runs.forEach((r, i) => drawRuns([r], 60, top + i * lh, size, P.text));

  /* sub */
  ctx.fillStyle = P.hair; ctx.fillRect(60, 1205, 870, 2);
  drawRuns([['cjk', fmtSub(b.sub, n)]], 60, 1232, 54, P.text);

  /* panel */
  if (b.panel === 'bar') {
    ctx.font = mono(64, false); ctx.fillStyle = P.text; ctx.textAlign = 'left';
    ctx.fillText(st.s.toFixed(2) + ' m / ' + n.track.toFixed(0) + ' m', 60, 1312 + 48);
    ctx.fillStyle = P.hair; ctx.fillRect(60, 1402, 870, 4);
    const bx = 60 + 870 * Math.min(1, st.s / n.track);
    if (bx > 63) { ctx.fillStyle = P.accent; ctx.fillRect(60, 1393, bx - 60, 22); }
    const cx2 = 60 + 870 * Math.min(1, n.contact / n.track);
    ctx.fillStyle = P.warn; ctx.fillRect(cx2 - 2, 1372, 4, 62);
    ctx.font = mono(48, false); ctx.fillStyle = P.dim;
    ctx.textAlign = 'left'; ctx.fillText('0', 60, 1428 + 40);
    ctx.textAlign = 'right'; ctx.fillText(n.track.toFixed(0) + ' m', 930, 1428 + 40);
    ctx.font = cjk(48, 400); ctx.fillStyle = P.warn; ctx.textAlign = 'right';
    ctx.fillText('贴合 ' + n.contact.toFixed(3) + ' m', 930, 1312 + 38);
  } else if (b.panel === 'nums') {
    b.nums.forEach(([label, key, unit], i) => {
      const x = 60 + i * 292;
      ctx.font = cjk(48, 400); ctx.fillStyle = P.dim; ctx.textAlign = 'left';
      ctx.fillText(label, x, 1318 + 38);
      const val = f2(n[key]);
      ctx.font = mono(84, true); ctx.fillStyle = P.text;
      ctx.fillText(val, x, 1366 + 70);
      ctx.font = cjk(48, 400); ctx.fillStyle = P.dim;
      ctx.fillText(unit, x + 8 + 0.56 * 84 * val.length, 1400 + 38);
    });
  }
  document.getElementById('stat').textContent =
    'frame ' + frame + '/' + (N - 1) + '  t=' + t.toFixed(2) + 's  s=' + st.s.toFixed(2) +
    'm  ψ=' + st.psi.toFixed(2) + '°  beat ' + bi;
}

function render() { try { draw(); } catch (e) { errs.push(String(e)); } }

function tick(ts) {
  if (playing) {
    frame = (frame + 1) % N;
    render();
  }
  requestAnimationFrame(tick);
}

/* ---------- export ---------- */
function bytesOf(dataURL) {
  const b64 = dataURL.split(',')[1] || '';
  return Math.floor(b64.length * 3 / 4) - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);
}
function pngBytes() {
  render();
  const u = cv.toDataURL('image/png');
  if (u.slice(0, 22) !== 'data:image/png;base64,') errs.push('export not PNG');
  return bytesOf(u);
}
function save(name, dataURL) {
  const a = document.createElement('a');
  a.href = dataURL; a.download = name; a.click();
}
function exportPNG() {
  const n = pngBytes();
  save(DATA.id + '-' + DATA.episode + '-1080x1920.png', cv.toDataURL('image/png'));
  return n;
}
function exportCover() {
  render();
  const c2 = document.createElement('canvas');
  c2.width = 1080; c2.height = 1350;
  const g = c2.getContext('2d');
  g.fillStyle = P.bg; g.fillRect(0, 0, 1080, 1350);
  g.drawImage(cv, 0, 285, 1080, 1350, 0, 0, 1080, 1350);
  const u = c2.toDataURL('image/png');
  save(DATA.id + '-' + DATA.episode + '-1080x1350.png', u);
  return bytesOf(u);
}

/* ---------- metrics ---------- */
function metrics() {
  render();
  const d = ctx.getImageData(0, 0, W, H).data;
  const lum = i => 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  let ink = 0, tot = 0;
  const cols = new Set();
  for (let y = SAFE.y0; y < SAFE.y1; y += 3) {
    for (let x = SAFE.x0; x < SAFE.x1; x += 3) {
      const i = (y * W + x) * 4;
      tot++;
      if (lum(i) > 24) {
        ink++;
        cols.add(((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3));
      }
    }
  }
  return { inkPct: +(ink / tot * 100).toFixed(2), colours: cols.size,
           frame: frame, t: frame / FPS };
}

function selfTest() {
  const e = [];
  if (!cv || cv.width !== 1080 || cv.height !== 1920) e.push('canvas 尺寸错');
  render();
  const m = metrics();
  if (m.inkPct < 8) e.push('安全区墨量 ' + m.inkPct + '%');
  if (m.colours < 48) e.push('色彩 ' + m.colours);
  const n = DATA.num;
  if (!(n.t20 >= 1.0 && n.t20 <= 1.25)) e.push('20m 成绩 ' + n.t20);
  if (!(n.v >= 15 && n.v <= 22)) e.push('末速 ' + n.v);
  if (!(n.d_now > n.dcrit)) e.push('偏移未超临界');
  return { ok: e.length === 0, errs: e };
}

window.__app = {
  canvas: cv,
  getState: () => ({ frame: frame, t: frame / FPS, playing: playing,
                     beat: beatIndex(frame / FPS), total: N }),
  getMetrics: metrics,
  set: (k, v) => {
    if (k === 'frame') { frame = Math.max(0, Math.min(N - 1, v | 0)); render(); }
    else if (k === 'playing') playing = !!v;
    return { frame: frame, playing: playing };
  },
  selfTest: selfTest,
  exportPNG: exportPNG,
  exportCover: exportCover,
  downloadAll: () => ({ png: exportPNG(), cover: exportCover() }),
  data: DATA
};

document.getElementById('bPlay').onclick = () => { playing = !playing; };
document.getElementById('bPrev').onclick = () => { playing = false; frame = (frame + N - 1) % N; render(); };
document.getElementById('bNext').onclick = () => { playing = false; frame = (frame + 1) % N; render(); };
document.getElementById('bPng').onclick = () => exportPNG();
document.getElementById('bCov').onclick = () => exportCover();
document.getElementById('bAll').onclick = () => window.__app.downloadAll();
addEventListener('keydown', ev => {
  if (ev.code === 'Space') { playing = !playing; ev.preventDefault(); }
  if (ev.code === 'ArrowRight') { playing = false; frame = (frame + 1) % N; render(); }
  if (ev.code === 'ArrowLeft') { playing = false; frame = (frame + N - 1) % N; render(); }
});

render();
requestAnimationFrame(tick);
</script>
</html>
