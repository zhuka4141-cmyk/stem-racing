<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>涂装工作室 · Livery Studio</title>
<link rel="stylesheet" href="./design-tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; background: #070708; color: #f2f0eb;
    font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap {
    display: flex; gap: 32px; padding: 28px;
    align-items: flex-start; min-height: 100vh; box-sizing: border-box;
  }
  #stage {
    display: block; width: 432px; height: 768px;
    background: #0b0b0c; flex: 0 0 auto;
    border: 1px solid rgba(242,240,235,0.10);
  }
  .panel {
    flex: 1 1 auto; max-width: 360px; min-width: 260px;
    font-family: "JetBrains Mono","IBM Plex Mono","Roboto Mono",Consolas,"Microsoft YaHei","Noto Sans SC",monospace;
    font-size: 13px; line-height: 1.5;
  }
  .panel h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .14em;
    text-transform: uppercase; margin: 0 0 4px;
  }
  .panel .hint { font-size: 11px; color: rgba(242,240,235,0.42); margin: 0 0 22px; line-height: 1.7; }
  .row { margin-bottom: 18px; }
  .row .lab {
    display: block; color: rgba(242,240,235,0.55); margin-bottom: 7px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  select {
    width: 100%; padding: 11px 12px; cursor: pointer;
    background: #14141a; color: #f2f0eb;
    border: 1px solid rgba(242,240,235,0.16); border-radius: 0;
    font: inherit; font-size: 14px;
  }
  select:focus-visible { outline: 2px solid #e8590c; outline-offset: 1px; }
  .nav { display: flex; gap: 8px; margin-bottom: 18px; }
  .nav button {
    flex: 1 1 0; margin: 0; padding: 11px;
    background: transparent; color: #f2f0eb;
    border: 1px solid rgba(242,240,235,0.16);
  }
  .nav button:hover:not(:disabled) { border-color: #e8590c; color: #e8590c; }
  button {
    width: 100%; padding: 14px; cursor: pointer;
    background: #e8590c; color: #0b0b0c; border: 0; border-radius: 0;
    font: inherit; font-weight: 600; letter-spacing: .10em; text-transform: uppercase;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: default; }
  .note {
    font-size: 11px; color: rgba(242,240,235,0.34); line-height: 1.8;
    margin-top: 20px; border-top: 1px solid rgba(242,240,235,0.08); padding-top: 14px;
  }
  .note b { color: rgba(242,240,235,0.55); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 820px) {
    .wrap { flex-direction: column; gap: 20px; padding: 16px; }
    #stage { width: 300px; height: 533px; }
    .panel { max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <div class="panel">
    <h1>涂装工作室</h1>
    <p class="hint">八套预设 · 实时换材质 · 三维车体</p>

    <div class="row">
      <span class="lab">配色预设</span>
      <select id="preset"></select>
    </div>

    <div class="nav">
      <button id="prev" type="button">← 上一套</button>
      <button id="next" type="button">下一套 →</button>
    </div>

    <button id="export">导出 9:16</button>

    <p class="note">
      <b>颜色不改性能</b><br>
      换涂装只动材质参数，质量、质心、气动一律不变。
      真车换面漆要重新称重——一套面漆 3–6 g，占整车 5–9%，<b>会改成绩</b>。<br><br>
      门禁会比对切换前后导出的哈希，<b>画面不变就是没换成功</b>。
    </p>
  </div>
</div>
<script src="./dist/app.js"></script>
</body>
</html>
