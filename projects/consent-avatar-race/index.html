<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>起跑线 · consent-avatar-race</title>
<link rel="stylesheet" href="./design-tokens.css">
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
<div class="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>

  <aside class="panel" id="panel">
    <div class="hd">
      <span class="k">CONSENT-AVATAR-RACE</span>
      <span class="v">起跑线</span>
    </div>

    <section class="sec">
      <div class="lb"><span>01 / 同意</span></div>
      <label class="chk">
        <input type="checkbox" id="consent">
        <span>这些照片是我自己的，或者我已经问过照片里的人，同意只在这台机器上用来排这张图。</span>
      </label>
      <p class="note">照片只在本机内存里处理。上传、写盘、缓存都没有，刷新页面就没了。</p>
    </section>

    <section class="sec">
      <div class="lb"><span>02 / 本机照片</span><span class="n" id="photoN">0 / 8</span></div>
      <input type="file" id="file" accept="image/*" multiple>
      <div class="row" style="margin-top:10px">
        <button id="clear" type="button">清空照片</button>
      </div>
    </section>

    <section class="sec">
      <div class="lb"><span>03 / 名字</span><span>一行一个</span></div>
      <textarea id="names" rows="7" spellcheck="false" autocapitalize="off"></textarea>
    </section>

    <section class="sec">
      <div class="lb"><span>04 / 发车</span></div>
      <button id="race" data-primary disabled>发车</button>
      <button id="reseed" type="button">换一个种子</button>
      <div class="readout"><span>SEED</span><b id="seedOut">0x00C0FF</b></div>
    </section>

    <section class="sec">
      <div class="lb"><span>05 / 导出</span></div>
      <div class="row">
        <button id="ex1" type="button">9:16 竖版</button>
        <button id="ex2" type="button">4:5 封面</button>
      </div>
      <div style="margin-top:12px">
        <div class="stat"><span>已生成 blob URL</span><b id="sMade">0</b></div>
        <div class="stat"><span>已回收</span><b id="sRevoked">0</b></div>
        <div class="stat"><span>未勾同意被拦</span><b id="sBlocked">0</b></div>
      </div>
    </section>
  </aside>
</div>

<script src="./dist/app.js"></script>
</body>
</html>
